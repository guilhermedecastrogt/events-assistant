[project]
name = "events-assistant"
version = "0.1.0"
description = "Personal WhatsApp assistant for tech events: LLM as interface, Postgres as state machine"
authors = [
    { name = "Guilherme de Castro", email = "guilhermecastro1000@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "N",   # pep8-naming
    "RUF", # ruff-specific
    "DTZ", # no naive datetimes (clock is injected, times are tz-aware)
    "S",   # flake8-bandit (security)
]

[tool.ruff.lint.isort]
known-first-party = ["events_assistant"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]  # asserts are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "integration: needs a running Postgres (DATABASE_URL)",
]

[tool.coverage.run]
source = ["events_assistant"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85
exclude_also = ['if __name__ == "__main__":']
