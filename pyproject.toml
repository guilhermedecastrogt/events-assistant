[project]
name = "events-assistant"
version = "0.1.0"
description = "Personal WhatsApp assistant for tech events: LLM as interface, Postgres as state machine"
authors = [
    { name = "Guilherme de Castro", email = "guilhermecastro1000@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.0",
]
