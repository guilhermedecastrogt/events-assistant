name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel runs on main: every merged commit should get a CI result.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: events
          POSTGRES_PASSWORD: events
          POSTGRES_DB: events
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U events -d events"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://events:events@localhost:5432/events
      UV_PYTHON_PREFERENCE: only-managed
      # Integration tests fail (instead of skipping) if Postgres is unreachable.
      REQUIRE_DB: "1"

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check .

      - name: Format check
        run: uv run ruff format --check .

      - name: Other pre-commit hooks (secrets, whitespace, yaml/toml)
        run: uv run pre-commit run --all-files --show-diff-on-failure
        env:
          SKIP: ruff-check,ruff-format

      - name: Tests
        run: uv run pytest --cov --cov-report=term-missing
